name: Bug report
description: Report a reproducible W1 NFC Reader problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do **not** post real meter IDs, NFC UIDs, private consumption history, backups, signing secrets or unredacted raw captures.

  - type: input
    id: version
    attributes:
      label: App version
      description: For example 1.0.0.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Android device and version
      placeholder: Pixel 7 / Android 17
    validations:
      required: true

  - type: input
    id: meter
    attributes:
      label: Meter model / visible revision information
      description: Do not include the meter serial number or NFC UID.
      placeholder: Axioma Qalcosonic W1
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Live NFC read
        - Monthly history sync
        - History / statistics
        - Backup / restore
        - CSV export
        - Sharing
        - Language / appearance
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Describe what you did without publishing private meter data.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: safe_diagnostics
    attributes:
      label: Privacy-safe diagnostics
      description: Paste only diagnostics that you have checked for private meter/consumption data.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed meter IDs, NFC UIDs, consumption history, backups, secrets and unredacted raw captures from this report.
          required: true
