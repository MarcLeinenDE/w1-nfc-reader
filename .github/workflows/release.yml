name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.release-signing/w1-nfc-reader-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.W1_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.W1_RELEASE_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.W1_RELEASE_KEY_PASSWORD }}
      QALCOSONIC_SOURCE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Validate tag and release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          if [[ "$VERSION_NAME" == *-dev* ]]; then
            echo "Refusing release from development version: $VERSION_NAME" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION_NAME}" >&2
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.W1_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          mkdir -p "$(dirname "$ANDROID_KEYSTORE_PATH")"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Check translations
        run: python3 scripts/check_product_i18n.py

      - name: Run tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify release signer
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.W1_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_CERT_SHA256"
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee signer.txt
          ACTUAL="$(awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}' signer.txt | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Release signer mismatch" >&2
            echo "Expected: $EXPECTED" >&2
            echo "Actual:   $ACTUAL" >&2
            exit 1
          fi

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          OUT="release-assets/w1-nfc-reader-${VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "release-assets/w1-nfc-reader-${VERSION_NAME}.apk.sha256"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/w1-nfc-reader-${{ env.VERSION_NAME }}.apk
            release-assets/w1-nfc-reader-${{ env.VERSION_NAME }}.apk.sha256

      - name: Remove temporary release keystore
        if: always()
        shell: bash
        run: rm -rf "${{ github.workspace }}/.release-signing"
